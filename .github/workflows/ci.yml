name: CI

on:
  push:
    branches: [main]
    # Skip the full matrix when only benchmark data changed (committed
    # every night by the Nightly Benchmark workflow).
    paths-ignore:
      - "benchmarks/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Git Bash is available on every runner family (incl. Windows), so bash
# semantics apply to all run steps: /dev/null redirects and dist/* globs
# work identically on Windows, macOS and Linux.
defaults:
  run:
    shell: bash

# NOTE: all five jobs (lint, test, and the three per-OS package jobs)
# have NO `needs:` dependency, so GitHub starts them all at the same
# time, in parallel.
jobs:
  # ------------------------------------------------------------------ #
  # Lint — OS-independent, run once on the newest LTS runner
  # ------------------------------------------------------------------ #
  lint:
    name: Lint (flake8 + actionlint)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Fails fast: needs only the repo, so run it BEFORE any Python/uv
      # setup. Validates the YAML syntax AND the ${{ }} expressions of
      # every .github/workflows/*.yml in ~1s, so a broken workflow is
      # caught before the 44 parallel jobs (lint + 40 test + 3 package)
      # finish. Also runs shellcheck on the run: scripts (preinstalled
      # on Ubuntu runners).
      - name: Validate workflow syntax
        uses: rhysd/actionlint@v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Lint Python code
        run: uvx flake8 sys_opt tests

  # ------------------------------------------------------------------ #
  # Tests — full matrix: every runner × every supported Python version
  # ------------------------------------------------------------------ #
  test:
    name: Tests (${{ matrix.os }} · py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---------- Linux (x86_64) ----------
          # Ubuntu 22.04 — older LTS
          - { os: ubuntu-22.04, python-version: "3.8" }
          - { os: ubuntu-22.04, python-version: "3.9" }
          - { os: ubuntu-22.04, python-version: "3.10" }
          - { os: ubuntu-22.04, python-version: "3.11" }
          - { os: ubuntu-22.04, python-version: "3.12" }
          # Ubuntu 24.04 — current LTS, all supported Pythons
          - { os: ubuntu-24.04, python-version: "3.8" }
          - { os: ubuntu-24.04, python-version: "3.9" }
          - { os: ubuntu-24.04, python-version: "3.10" }
          - { os: ubuntu-24.04, python-version: "3.11" }
          - { os: ubuntu-24.04, python-version: "3.12" }
          - { os: ubuntu-24.04, python-version: "3.13" }
          - { os: ubuntu-24.04, python-version: "3.14" }
          # Ubuntu 24.04 (arm64)
          - { os: ubuntu-24.04-arm, python-version: "3.10" }
          - { os: ubuntu-24.04-arm, python-version: "3.11" }
          - { os: ubuntu-24.04-arm, python-version: "3.12" }
          - { os: ubuntu-24.04-arm, python-version: "3.13" }
          - { os: ubuntu-24.04-arm, python-version: "3.14" }
          # ---------- macOS ----------
          # macOS 15 Intel (x86_64)
          - { os: macos-15-intel, python-version: "3.8" }
          - { os: macos-15-intel, python-version: "3.9" }
          - { os: macos-15-intel, python-version: "3.10" }
          - { os: macos-15-intel, python-version: "3.11" }
          - { os: macos-15-intel, python-version: "3.12" }
          - { os: macos-15-intel, python-version: "3.13" }
          # macOS 14 (Apple Silicon arm64)
          - { os: macos-14, python-version: "3.9" }
          - { os: macos-14, python-version: "3.10" }
          - { os: macos-14, python-version: "3.11" }
          - { os: macos-14, python-version: "3.12" }
          - { os: macos-14, python-version: "3.13" }
          - { os: macos-14, python-version: "3.14" }
          # ---------- Windows ----------
          # Windows Server 2025
          - { os: windows-2025, python-version: "3.8" }
          - { os: windows-2025, python-version: "3.9" }
          - { os: windows-2025, python-version: "3.10" }
          - { os: windows-2025, python-version: "3.11" }
          # Windows Server 2022 — all supported Pythons
          - { os: windows-2022, python-version: "3.8" }
          - { os: windows-2022, python-version: "3.9" }
          - { os: windows-2022, python-version: "3.10" }
          - { os: windows-2022, python-version: "3.11" }
          - { os: windows-2022, python-version: "3.12" }
          - { os: windows-2022, python-version: "3.13" }
          - { os: windows-2022, python-version: "3.14" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: uv pip install --system -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke — CLI entry points
        run: |
          python -m sys_opt --version
          python -m sys_opt --list-languages >/dev/null
          python -m sys_opt --inspect --json | python -c "import json,sys; json.load(sys.stdin); print('JSON OK')"

  # ------------------------------------------------------------------ #
  # Package — one independent job PER OS: build sdist+wheel, validate
  # with twine, install the wheel in a clean venv and smoke test it.
  # Three separate jobs (not a matrix) so a failure on one OS never
  # hides the others and each appears as its own entry in the UI.
  # ------------------------------------------------------------------ #
  package-linux:
    name: Package (Linux · ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-path: requirements.txt
      - name: Build sdist and wheel
        run: uv build
      - name: Validate artifacts
        run: uvx twine check dist/*
      - name: Install wheel in a clean venv and smoke test
        run: |
          uv venv .smoke-venv
          uv pip install --python .smoke-venv/bin/python dist/*.whl
          .smoke-venv/bin/python -m sys_opt --version
          .smoke-venv/bin/python -m sys_opt --inspect --json \
            | .smoke-venv/bin/python -c "import json,sys; json.load(sys.stdin); print('INSTALL_OK')"

  package-macos:
    name: Package (macOS · macos-14)
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-path: requirements.txt
      - name: Build sdist and wheel
        run: uv build
      - name: Validate artifacts
        run: uvx twine check dist/*
      - name: Install wheel in a clean venv and smoke test
        run: |
          uv venv .smoke-venv
          uv pip install --python .smoke-venv/bin/python dist/*.whl
          .smoke-venv/bin/python -m sys_opt --version
          .smoke-venv/bin/python -m sys_opt --inspect --json \
            | .smoke-venv/bin/python -c "import json,sys; json.load(sys.stdin); print('INSTALL_OK')"

  package-windows:
    name: Package (Windows · windows-2022)
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-path: requirements.txt
      - name: Build sdist and wheel
        run: uv build
      - name: Validate artifacts
        run: uvx twine check dist/*
      - name: Install wheel in a clean venv and smoke test
        run: |
          uv venv .smoke-venv
          uv pip install --python .smoke-venv/Scripts/python dist/*.whl
          .smoke-venv/Scripts/python -m sys_opt --version
          .smoke-venv/Scripts/python -m sys_opt --inspect --json \
            | .smoke-venv/Scripts/python -c "import json,sys; json.load(sys.stdin); print('INSTALL_OK')"
