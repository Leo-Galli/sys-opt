name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    name: Build & publish to PyPI
    runs-on: ubuntu-latest
    environment: release
    permissions:
      # Trusted publishing (OIDC) — no PYPI_API_TOKEN secret needed if the
      # PyPI project "sys-opt" has a trusted publisher configured for this repo.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Fail fast before spending time building: the pushed tag (e.g. v1.1.0)
      # must match BOTH the version in pyproject.toml AND the runtime
      # __version__ in sys_opt/__init__.py (what `sys-opt --version` prints),
      # otherwise the release would publish with a mismatched version.
      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME}"
          PYPROJECT_VERSION="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          CLI_VERSION="$(python -c "from sys_opt import __version__; print(__version__)")"
          echo "Tag:        ${TAG}"
          echo "pyproject:  ${PYPROJECT_VERSION}"
          echo "CLI:        ${CLI_VERSION}"
          if [ "v${PYPROJECT_VERSION}" != "${TAG}" ] || [ "v${CLI_VERSION}" != "${TAG}" ]; then
            echo "::error::Tag ${TAG} does not match pyproject.toml (${PYPROJECT_VERSION}) or sys_opt/__init__.py (${CLI_VERSION}). Bump both first, then re-tag."
            exit 1
          fi
          echo "Version guard OK: ${TAG} matches pyproject.toml and sys_opt/__init__.py"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check the built artifacts
        run: twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
