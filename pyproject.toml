[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sys-opt"
version = "1.0.0"
description = "Universal Hardware Inspector & Multi-OS Optimizer - inspect hardware, tune your OS, in 10+ languages."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
keywords = ["hardware", "inspector", "optimizer", "windows", "macos", "linux", "cli", "i18n"]
classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: System :: Hardware",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "rich>=13.0",
    "psutil>=5.9",
]

[project.urls]
Homepage = "https://github.com/Leo-Galli/sys-opt"
Repository = "https://github.com/Leo-Galli/sys-opt"
Documentation = "https://github.com/Leo-Galli/sys-opt"

[project.scripts]
sys-opt = "sys_opt.main:main"

[tool.setuptools.packages.find]
include = ["sys_opt*"]
